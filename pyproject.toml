[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vidsum-local"
version = "0.4.1"
description = "Summarize any video locally, from a file or a link (YouTube, Bilibili, Douyin, TikTok, ...): transcript, key frames, on-screen text and a timestamped summary. CLI and MCP server for Apple Silicon, with an experimental cloud mode."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "allenwu-blip" }]
keywords = ["video", "summarize", "summary", "transcribe", "transcription", "subtitles", "whisper", "mlx", "apple-silicon", "local-ai", "mcp", "mcp-server", "ocr", "vlm", "yt-dlp", "youtube", "bilibili", "douyin", "tiktok", "xiaohongshu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=1.0",
  "Pillow>=10.3",
  "mcp>=2.3,<3",
  "yt-dlp[default,curl-cffi,deno]>=2026.11.23",
  "mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-vlm>=0.7.12,<0.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.32.2,<0.34; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyobjc-framework-Vision>=11; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
  "pyobjc-framework-SoundAnalysis>=11; sys_platform == 'darwin'",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]

[project.urls]
Homepage = "https://github.com/allenwu-blip/vidsum"
Repository = "https://github.com/allenwu-blip/vidsum"
Issues = "https://github.com/allenwu-blip/vidsum/issues"

[project.scripts]
vidsum = "vidsum.cli:main"
vidsum-local = "vidsum.cli:main"
vidsum-mcp = "vidsum.mcp_server:main"

[tool.setuptools.packages.find]
include = ["vidsum*"]
